[project]
name = "cvscore"
version = "0.1.0"
description = "Rank candidate CVs, cover letters and application forms against a job description."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19",
    "fastapi>=0.115",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langfuse>=4.0",
    "langgraph>=1.0",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

# Dev tools are declared twice: as a dependency group so `uv run pytest` / `uv sync` pick
# them up by default, and as an extra for `pip install -e ".[dev]"`. Keep the lists in sync.
[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.6",
    "types-pyyaml",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.6",
    "types-pyyaml",
]

[project.scripts]
cvscore = "cvscore.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvscore"]
# The built web front end (frontend/ -> cvscore/web/static) is git-ignored but shipped.
artifacts = ["cvscore/web/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as `tests.ingest.builders`
markers = ["live: calls a real model API; opt-in with CVSCORE_LIVE=1 and OPENAI_API_KEY"]
