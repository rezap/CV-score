# Copy to cvscore.yaml (git-ignored) and fill in your details.
#
# provider: azure (Azure AI Foundry, Entra ID) or openai (OpenAI API key).
provider: azure

# Any value can be overridden by an environment variable, e.g.
#   CVSCORE_AZURE__ENDPOINT=https://my-resource.openai.azure.com
# Authentication is Entra ID (DefaultAzureCredential): `az login` locally,
# managed identity in Azure. Your identity needs the "Cognitive Services OpenAI User"
# role on the Azure OpenAI / AI Services resource.

azure:
  # Either style works:
  #   https://<your-resource>.openai.azure.com/openai/v1   v1 API (no api_version needed)
  #   https://<your-resource>.openai.azure.com             classic API, uses api_version
  endpoint: https://<your-resource>.openai.azure.com/openai/v1
  api_version: "2024-10-21"   # classic API only
  models:
    # Deployment names from your Foundry project. Roles you leave out reuse `scorer`.
    extractor:
      deployment: <cheap-fast-deployment>
    scorer:
      deployment: <main-deployment>
    agent:
      deployment: <tool-calling-deployment>
    judge:
      deployment: <strongest-deployment>
      # Reasoning models (o-series, gpt-5 and later) get no temperature unless you set one.
      # reasoning_effort: medium
  embeddings:
    deployment: <embedding-deployment>
  max_concurrency: 8
  max_retries: 6
  timeout_s: 120

# Used when provider: openai. The key comes from the OPENAI_API_KEY environment variable
# (or the variable named in api_key_env), never from this file.
openai:
  # api_key_env: OPENAI_API_KEY
  # base_url: https://my-openai-compatible-proxy/v1
  models:
    scorer:
      model: <model-name>          # e.g. a model that supports structured outputs
    # extractor / agent / judge: optional, default to the scorer's model
    # judge:
    #   model: <reasoning-model>
    #   temperature: null
    #   reasoning_effort: medium
  max_concurrency: 8

langfuse:
  enabled: true
  # Keys come from LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY.
  # host: https://langfuse.your-company.internal
  environment: development
  mask_pii: true

ocr:
  # Scanned CVs (PDF pages without text) and image files named as a CV/letter are read by
  # the vision model of this role. It sees the page before redaction; these calls are
  # never traced. Results are cached, so each page is read once.
  enabled: true
  role: extractor
  dpi: 150
  max_pages: 6

screening:
  # Semantic matching uses the embeddings model (azure.embeddings / openai.embeddings);
  # without one, screening uses keywords only.
  semantic: true
  similarity_floor: 0.25   # cosine similarity that counts as no match
  similarity_full: 0.55    # ... and as a full (semantic) match
  required_semantic: 0.6   # a required criterion without keywords passes above this

ranking:
  knockout: flag          # flag | exclude: what happens when a must-have is clearly not met
  low_confidence: 0.5     # flag scores whose confidence is below this
  max_dropped_quotes: 3   # flag candidates with this many unverifiable model quotes
