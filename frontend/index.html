<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cvscore</title>
    <script>
      // Apply the saved theme before the first paint (see useTheme in src/ui.tsx).
      try {
        const t = JSON.parse(localStorage.getItem("cvscore:theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
