name: Live LLM test

# End-to-end run against a real OpenAI model (job draft -> ingest -> score -> rank -> report),
# on fictional candidates generated by the tests. Costs a few cents per run, so it only runs
# when started by hand (Actions > Live LLM test > Run workflow) or on a pull request that
# carries the `live-test` label.
#
# Setup: add the repository secret OPENAI_API_KEY. Optionally set the repository variable
# OPENAI_MODEL (the model used for all roles; default gpt-4.1-mini).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model for all roles (blank: variable OPENAI_MODEL or gpt-4.1-mini)"
        required: false
        default: ""
  pull_request:
    types: [labeled, synchronize]

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'live-test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CVSCORE_LIVE: "1"
      CVSCORE_LIVE_MODEL: ${{ inputs.model || vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      CVSCORE_LIVE_OUT: ${{ github.workspace }}/live-out
    steps:
      - name: Check the API key secret
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::error::Add the OPENAI_API_KEY repository secret (Settings > Secrets and variables > Actions)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Live end-to-end test
        run: pytest tests/live -v -s -rs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: live-out/
          retention-days: 7
          if-no-files-found: ignore
